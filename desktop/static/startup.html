<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Threadmark</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f8fafc;
        color: #182033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .brand { position: fixed; left: 28px; top: 24px; font-weight: 700; }
      section {
        width: min(460px, 100%);
        padding: 40px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: white;
        text-align: center;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }
      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 22px;
        place-items: center;
        border-radius: 17px;
        background: #6655e8;
        color: white;
        font-size: 22px;
        font-weight: 800;
        box-shadow: 0 12px 28px rgba(102, 85, 232, 0.25);
      }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 12px 0 0; color: #64748b; line-height: 1.6; }
      .progress {
        width: 100%;
        height: 4px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: #ede9fe;
      }
      .progress::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #6655e8;
        content: "";
        animation: loading 1.25s ease-in-out infinite alternate;
      }
      @keyframes loading { from { transform: translateX(-35%); } to { transform: translateX(155%); } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Threadmark</div>
      <section>
        <div class="mark">T</div>
        <h1>Abrindo o Threadmark</h1>
        <p>Preparando banco, captura e interface com segurança…</p>
        <div class="progress" aria-label="Carregando" role="progressbar"></div>
      </section>
    </main>
  </body>
</html>
