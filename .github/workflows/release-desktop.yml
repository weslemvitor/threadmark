name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build and publish macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const expected=`v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) { throw new Error(`A tag ${process.env.RELEASE_TAG} não corresponde à versão ${expected}.`) }'

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Validate, package and inspect the DMG
        run: npm run release:desktop

      - name: Publish Developer Preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "Threadmark ${GITHUB_REF_NAME} · Developer Preview"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release/Threadmark-${GITHUB_REF_NAME#v}-arm64.dmg" \
            "release/Threadmark-${GITHUB_REF_NAME#v}-arm64.dmg.sha256" \
            --clobber
